[project]
name = "MLOps_pipeline"
version = "1.0.0"
description = "CLI pipeline for fine-tuning a sentiment classifier on Booking.com reviews"
readme = "README.md"

requires-python = "==3.11.*"

dependencies = [
    "captum",
    "cleanlab",
    "datasets<3",
    "giskard",
    "ipython",
    "matplotlib",
    "pydantic>=2",
    "pandas",
    "scikit-learn",
    "sentence-transformers",
    "typer>=0.9",
    "transformers[torch]",
]

# Development tools (installed by `uv sync`, skipped with `uv sync --no-dev`, e.g. in Docker)
[dependency-groups]
dev = [
    "jupyter",
    "pytest",
    "ruff",
]

[project.scripts]
booking-sentiment = "booking_sentiment.cli:app"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["booking_sentiment*"]
exclude = ["artifacts", "configs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
